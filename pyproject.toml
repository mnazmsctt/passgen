[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "passgen"
version = "0.2.0"
description = "Password Generator CLI yang keren"
authors = [{ name = "Nazmi Firdaus", email = "nazmifurdaus@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "typer[all]>=0.9.0",
    "pyperclip>=1.8.0",
    "rich>=13.0.0",
]

[project.scripts]
passgen = "passgen.cli:app"